name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The tag push creates the GitHub Release, which needs contents: write. Without this the
# default token is read-only and softprops/action-gh-release fails with HTTP 403.
permissions:
  contents: write

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ secrets.KEYSTORE }}" = "" ]; then
            echo "::error::Signing secrets not configured. KEYSTORE secret is required for release builds."
            exit 1
          fi

      - name: Create keystore
        if: github.event_name != 'pull_request'
        run: |
          # app/build.gradle.kts signs with app/keystore.jks (gitignored; the README
          # documents how to generate it), so the KEYSTORE secret has to be decoded
          # into app/, not into the repo root the upstream workflow used.
          echo ${{ secrets.KEYSTORE }} | base64 --decode > app/keystore.jks
          ls -l app/keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DirtyFragX APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # app/build.gradle.kts always writes app/build/outputs/apk/release/dirtyfragx.apk,
          # so the versioned asset name comes from the tag (v2.0.0 -> DirtyFragX-v2.0.0.apk).
          cp app/build/outputs/apk/release/dirtyfragx.apk "DirtyFragX-${GITHUB_REF_NAME}.apk"
          ls -l DirtyFragX-*.apk

      - name: Upload DirtyFragX APK
        uses: actions/upload-artifact@v7
        with:
          name: DirtyFragX
          path: |
            app/build/outputs/apk/release/dirtyfragx.apk
            app/build/outputs/apk/debug/dirtyfragx.apk

      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Take just the section for this tag: v1.11 -> the "## 1.11" block.
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '/^## /{p = ($0 == "## " ver); next} p' CHANGELOG.md > RELEASE_NOTES.md
          wc -l RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: DirtyFragX-*.apk
          body_path: RELEASE_NOTES.md

      # Deliberately not continue-on-error: a green run with no APK on Gitee is worse than
      # a red one, because nobody notices the mirror is broken.
      - name: Mirror release to Gitee
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: blblwanfeng
          GITEE_REPO: DirtyFragX
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::GITEE_TOKEN is not configured, skipping the Gitee release mirror."
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          ASSET="DirtyFragX-${GITHUB_REF_NAME}.apk"

          # Bounded timeouts: an unreachable Gitee otherwise hangs the job for minutes,
          # and the HTTP status is printed so a 401 (bad/expired token) is visible.
          gitee() {
            curl -sS --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 5 \
              -w '\nHTTP %{http_code}\n' "$@"
          }

          # Gitee mirrors the tag on its own (origin has two push URLs), so only the
          # release and its attachment are created here. Take the id straight from the
          # create response: listing the releases right after the POST can come back
          # without the new entry, which is what made an earlier run skip the upload.
          release_id=$(curl -sS --connect-timeout 15 --max-time 60 \
            -X POST "${API}/releases?access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${GITHUB_REF_NAME}" \
            --data-urlencode "name=${GITHUB_REF_NAME}" \
            --data-urlencode "target_commitish=master" \
            --data-urlencode "body@RELEASE_NOTES.md" | jq -r '.id // empty')

          # An existing release answers the POST with 400, so look the id up in that case.
          if [ -z "$release_id" ]; then
            release_id=$(curl -sS --connect-timeout 15 --max-time 60 --retry 2 \
              "${API}/releases?access_token=${GITEE_TOKEN}&per_page=100" \
              | jq -r --arg tag "$GITHUB_REF_NAME" '[.[] | select(.tag_name == $tag)][0].id // empty')
          fi
          echo "Gitee release id for ${GITHUB_REF_NAME}: ${release_id}"

          if [ -z "$release_id" ]; then
            echo "::error::No Gitee release found for ${GITHUB_REF_NAME}."
            exit 1
          fi

          # Re-running the job must not try to upload the same file twice.
          if curl -sS --max-time 60 "${API}/releases/${release_id}?access_token=${GITEE_TOKEN}" \
            | jq -e --arg f "$ASSET" '[.assets[].name] | index($f)' > /dev/null; then
            echo "${ASSET} is already attached, nothing to do."
            exit 0
          fi

          # The attachment endpoint is keyed by the numeric release id; the tag hits the
          # web 404 page. access_token has to be a query parameter here as well.
          gitee -X POST "${API}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}" \
            -F "file=@${ASSET}"
